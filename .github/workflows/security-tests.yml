name: Security tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  search-xss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: XSS regression (build-index + static checks)
        run: python3 test_security_search.py