<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Времето в София</title>
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f7f3ec; color: #2b2620; line-height: 1.55; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 32px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #8a8175; font-size: 14px; margin: 0 0 20px; }
  table { width: 100%; border-collapse: collapse; background: #fffdf9; border: 1px solid #ece4d6; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(60,45,20,.06); }
  th, td { text-align: left; padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #f0e9db; vertical-align: top; }
  th { background: #f3ecdd; color: #6b5f4d; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: none; }
  .dow { color: #8a8175; font-size: 12px; }
  .note { font-size: 13px; color: #8a8175; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Времето в София</h1>
  <p class="sub">3-дневна прогноза · обновено на 23.11.2026 · източник: wttr.in</p>
  <table>
    <tr><th>Ден</th><th>Условия</th><th>Макс / мин</th><th>Валеж</th><th>Вятър</th></tr>
    <tr><td><b>23.11</b><br><span class="dow">понеделник</span></td><td>Light rain shower</td><td>+10° / +1°</td><td>42%</td><td>20 км/ч</td></tr>
    <tr><td><b>24.11</b><br><span class="dow">вторник</span></td><td>Sunny</td><td>+3° / -2°</td><td>3%</td><td>17 км/ч</td></tr>
    <tr><td><b>25.11</b><br><span class="dow">сряда</span></td><td>Cloudy </td><td>+6° / -3°</td><td>7%</td><td>2 км/ч</td></tr>
  </table>
  <p class="note">Прогнозата се обновява всяка сутрин в 07:00.</p>
</div>
</body>
</html>
